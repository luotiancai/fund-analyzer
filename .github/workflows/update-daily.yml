name: 每日数据跑批

on:
  schedule:
    # 17:00 UTC = 北京次日 01:00:周二至周六凌晨跑。前一交易日 15:00 收盘,
    # 到凌晨1点已过去10小时——基金净值(通常当晚20:00~23:00公布)、上证日线、
    # 上交所期权风险指标(自算QVIX的数据源)都已发布。比原来的06:00提前5小时,
    # 早上打开页面时数据早就就绪, 不会撞上跑批还没跑完的空窗。
    # 周日/周一凌晨对应周六/周日, 没有新净值, 不跑。
    # 注: 万一某天数据还没发布, update_qvix_self_daily 有"补最近15天空值"的
    # 自愈逻辑, 下一次跑批会自动补上, 不需要为此把时间往后推。
    - cron: "0 17 * * 1-5"
  workflow_dispatch:      # 手动触发测试 / 单项补数据用
    inputs:
      mode:
        description: "跑什么"
        type: choice
        default: full
        options:
          - full          # 完整跑批(和定时一样)
          - scales-only   # 只刷基金季度规模(覆盖范围扩大后的一次性补全)

permissions:
  contents: write   # gh release upload 需要

# 跟 qvix-retry.yml(北京早上6点的 QVIX 补跑)共用一个并发组:两个 workflow
# 都是"下载 release 库 → 改 → 传回",同时跑会互相覆盖。共用并发组让后到的
# 那个排队等前一个跑完,而不是并行。cancel-in-progress 必须是 false——取消
# 跑到一半的跑批等于白跑几十分钟还什么都没写回去。
concurrency:
  group: fund-analyzer-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FUND_ANALYZER_DATA: ${{ github.workspace }}/.data
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖(不装 streamlit)
        run: pip install --quiet requests pandas numpy akshare
      - name: 取回上次的各个库(Release tag `data`)
        # 数据按 fetcher.DB_LAYOUT 分成若干独立的库, 每个库一个资产。以前是
        # 一个 400MB 的 fund_cache.db 打包所有表, 发布单元跟更新节奏对不上,
        # 推一次策略结果能把跑批攒五天的行情盖回去(2026-08-05)。
        # cache(筛选结果缓存)不取: 跑批不读它, 丢了应用自己重算。
        # strategy/sim 也不取: 权威写入方分别是本地回测和线上 app, 跑批只读
        # 不写, 取回来再传回去只会平白增加覆盖它们的机会。
        run: |
          mkdir -p "$FUND_ANALYZER_DATA"
          for db in fund_rank market fund_nav fund_scale; do
            if gh release download data --pattern "$db.db.gz" \
                 --output "$db.db.gz" --repo "$GITHUB_REPOSITORY"; then
              gunzip -c "$db.db.gz" > "$FUND_ANALYZER_DATA/$db.db"
              rm "$db.db.gz"
              echo "取回 $db.db ($(du -h "$FUND_ANALYZER_DATA/$db.db" | cut -f1))"
            else
              echo "::warning::$db.db.gz 不存在, 该库将从零开始"
            fi
          done

      - name: 跑批(增量补净值 + 重算指标 + 刷新上证/QVIX)
        # scales-only 只刷规模,别的一概不碰;定时触发没有 inputs,默认 full。
        run: |
          if [ "${{ github.event.inputs.mode }}" = "scales-only" ]; then
            python update_daily.py --scales-only
          else
            python update_daily.py
          fi
      - name: 压缩并回传各个库
        # 一个库一个资产, 各自独立。只传跑批真正写过的那几个 —— 不碰
        # strategy(本地回测发)、sim(线上 app 写)、cache(缓存)。
        run: |
          cd "$FUND_ANALYZER_DATA"
          for db in fund_rank market fund_nav fund_scale; do
            [ -f "$db.db" ] || { echo "::warning::缺 $db.db, 不传"; continue; }
            gzip -9 -c "$db.db" > "$db.db.gz"
          done
          ls -lh ./*.db.gz
          gh release create data --title "数据快照" \
            --notes "每日跑批产物,应用启动时自动拉取,请勿手动改动" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release upload data ./*.db.gz --clobber --repo "$GITHUB_REPOSITORY"
