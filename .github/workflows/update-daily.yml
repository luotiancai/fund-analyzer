name: 每日数据跑批

on:
  repository_dispatch:
    # GitHub 的 schedule 多次延迟数小时或漏跑。定时由 VPS 的 fund-nav-trigger.timer 执行。
    types: [fund-nav-update]
  workflow_dispatch:      # 手动触发测试 / 单项补数据用
    inputs:
      mode:
        description: "跑什么"
        type: choice
        default: full
        options:
          - full          # 完整跑批(和定时一样)
          - scales-only   # 只刷基金季度规模(覆盖范围扩大后的一次性补全)
          - inception-only # 只补充筛选范围内 C 份额的成立日
          - metrics-only  # 只用已有净值重算收益和回撤

permissions:
  contents: write   # gh release upload 需要

# VPS 定时触发和手动触发共享并发组，避免两个跑批同时下载并覆盖同一份 Release 数据库。
concurrency:
  group: fund-analyzer-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FUND_ANALYZER_DATA: ${{ github.workspace }}/.data
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装跑批依赖
        run: pip install --quiet requests pandas numpy akshare
      - name: 取回上次的各个库(Release tag `data`)
        # 只同步基金库。market 和 qvix 由 VPS 独占发布, strategy 由本地回测发布。
        run: |
          mkdir -p "$FUND_ANALYZER_DATA"
          dbs="fund_rank fund_nav fund_scale"
          if [ "${{ github.event.inputs.mode }}" = "inception-only" ]; then
            dbs="fund_rank"
          elif [ "${{ github.event.inputs.mode }}" = "metrics-only" ]; then
            dbs="fund_rank fund_nav"
          fi
          for db in $dbs; do
            if gh release download data --pattern "$db.db.gz" \
                 --output "$db.db.gz" --repo "$GITHUB_REPOSITORY"; then
              gunzip -c "$db.db.gz" > "$FUND_ANALYZER_DATA/$db.db"
              rm "$db.db.gz"
              echo "取回 $db.db ($(du -h "$FUND_ANALYZER_DATA/$db.db" | cut -f1))"
            else
              if [ "${{ github.event.inputs.mode }}" = "metrics-only" ]; then
                echo "::error::$db.db.gz 下载失败，停止重算"
                exit 1
              fi
              echo "::warning::$db.db.gz 不存在, 该库将从零开始"
            fi
          done

      # 规模单独放最后、单独回传, 避免季报到期时拖慢净值发布。
      # scales-only 只刷规模。VPS 的 repository_dispatch 没有 inputs，按 full 执行。
      - name: 跑批(增量补净值 + 重算指标)
        if: github.event.inputs.mode != 'scales-only' && github.event.inputs.mode != 'inception-only' && github.event.inputs.mode != 'metrics-only'
        run: python update_daily.py --no-scales
      - name: 仅重算收益和回撤
        if: github.event.inputs.mode == 'metrics-only'
        run: python update_daily.py --recompute-only
      - name: 补充 C 份额成立日期
        if: github.event.inputs.mode == 'inception-only'
        run: python update_daily.py --inception-only
      - name: 压缩并回传 净值/榜单
        if: github.event.inputs.mode != 'scales-only'
        run: |
          cd "$FUND_ANALYZER_DATA"
          up=""
          dbs="fund_rank fund_nav"
          if [ "${{ github.event.inputs.mode }}" = "inception-only" ] || [ "${{ github.event.inputs.mode }}" = "metrics-only" ]; then
            dbs="fund_rank"
          fi
          for db in $dbs; do
            [ -f "$db.db" ] || { echo "::warning::缺 $db.db, 不传"; continue; }
            gzip -9 -c "$db.db" > "$db.db.gz" && up="$up $db.db.gz"
          done
          ls -lh $up
          gh release create data --title "数据快照" \
            --notes "每日跑批产物,应用启动时自动拉取,请勿手动改动" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release upload data $up --clobber --repo "$GITHUB_REPOSITORY"
      - name: 刷新基金规模
        if: github.event.inputs.mode != 'inception-only' && github.event.inputs.mode != 'metrics-only'
        run: python update_daily.py --scales-only
      - name: 压缩并回传 规模
        if: github.event.inputs.mode != 'inception-only' && github.event.inputs.mode != 'metrics-only'
        run: |
          cd "$FUND_ANALYZER_DATA"
          gzip -9 -c fund_scale.db > fund_scale.db.gz
          ls -lh fund_scale.db.gz
          gh release upload data fund_scale.db.gz --clobber --repo "$GITHUB_REPOSITORY"
