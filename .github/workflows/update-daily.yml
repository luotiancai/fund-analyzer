name: 每日数据跑批

on:
  schedule:
    # 18:37 UTC = 北京次日 02:37:周二至周六凌晨跑。前一交易日 15:00 收盘,
    # 到凌晨2点半已过去11个半小时——基金净值(通常当晚20:00~23:00公布)和上证
    # 日线都已发布。早上打开页面时数据早就就绪, 不会撞上跑批还没跑完的空窗。
    # 周日/周一凌晨对应周六/周日, 没有新净值, 不跑。
    #
    # 分钟数必须错开整点: 原来写的 0 17 命中了 GitHub 全球调度高峰, 实测每次
    # schedule 事件都要压 80~110 分钟才派发, 2026-08-06 那次更是排了 16 分钟
    # 都没分到托管 runner, job 一步没跑就被判 cancelled(公共仓库的免费 job 在
    # runner 分配队列里优先级最低)。整点是最挤的, 别再往回改。
    #
    # ⚠️ schedule 这个闹钟本身不可靠, 别把它当唯一触发源。2026-08-10 起当前
    # cron 的 13 次排期实测: 中位迟 39 分钟, 最坏迟 151 分钟, 而 2026-08-27
    # 那次**整个被丢掉**——没有失败记录, 没有 job, 什么都没有, 数据就那么停在
    # 前一天。GitHub 官方文档写明拥堵时 "some queued jobs may be dropped"。
    # 分钟数早就错开整点了, 那条建议已经用尽, 别再往这个方向调。要根治得靠
    # 外部触发(workflow_dispatch 是同步建 run 的, 不经过这个会丢事件的定时器)。
    - cron: "37 18 * * 1-5"
  workflow_dispatch:      # 手动触发测试 / 单项补数据用
    inputs:
      mode:
        description: "跑什么"
        type: choice
        default: full
        options:
          - full          # 完整跑批(和定时一样)
          - scales-only   # 只刷基金季度规模(覆盖范围扩大后的一次性补全)

permissions:
  contents: write   # gh release upload 需要

# 并发组保留(现在组里只剩这一个 workflow —— qvix-retry.yml 已于 2026-08-28
# 删除, QVIX 改由国内 VPS 独占产出)。留着是因为手动 workflow_dispatch 和
# 定时那次完全可能撞上: 两次都是"下载 release 库 → 改 → 传回", 并行就会互相
# 覆盖。让后到的排队等前一个跑完。cancel-in-progress 必须是 false——取消跑到
# 一半的跑批等于白跑几十分钟还什么都没写回去。
concurrency:
  group: fund-analyzer-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FUND_ANALYZER_DATA: ${{ github.workspace }}/.data
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖(不装 streamlit)
        run: pip install --quiet requests pandas numpy akshare
      - name: 取回上次的各个库(Release tag `data`)
        # 数据按 fetcher.DB_LAYOUT 分成若干独立的库, 每个库一个资产。以前是
        # 一个 400MB 的 fund_cache.db 打包所有表, 发布单元跟更新节奏对不上,
        # 推一次策略结果能把跑批攒五天的行情盖回去(2026-08-05)。
        # cache(筛选结果缓存)不取: 跑批不读它, 丢了应用自己重算。
        # strategy 也不取: 权威写入方是本地回测, 跑批只读不写, 取回来再传
        # 回去只会平白增加覆盖它的机会。
        run: |
          # 列表里**没有 qvix.db**, 这是刻意的: 它的权威写入方是国内那台
          # VPS(上交所接口挡 runner 的境外 IP, 见 fetcher.DB_LAYOUT)。跑批
          # 既不读它也不写它, 更不能传它 —— 传了就是拿一份空库盖掉 VPS 的
          # 成果。
          mkdir -p "$FUND_ANALYZER_DATA"
          for db in fund_rank market fund_nav fund_scale; do
            if gh release download data --pattern "$db.db.gz" \
                 --output "$db.db.gz" --repo "$GITHUB_REPOSITORY"; then
              gunzip -c "$db.db.gz" > "$FUND_ANALYZER_DATA/$db.db"
              rm "$db.db.gz"
              echo "取回 $db.db ($(du -h "$FUND_ANALYZER_DATA/$db.db" | cut -f1))"
            else
              echo "::warning::$db.db.gz 不存在, 该库将从零开始"
            fi
          done

      - name: 跑批(增量补净值 + 重算指标 + 刷新上证)
        # scales-only 只刷规模,别的一概不碰;定时触发没有 inputs,默认 full。
        run: |
          if [ "${{ github.event.inputs.mode }}" = "scales-only" ]; then
            python update_daily.py --scales-only
          else
            python update_daily.py
          fi
      - name: 压缩并回传各个库
        # 一个库一个资产, 各自独立。只传跑批真正写过的那几个 —— 不碰
        # strategy(本地回测发)、cache(缓存)。
        run: |
          cd "$FUND_ANALYZER_DATA"
          for db in fund_rank market fund_nav fund_scale; do
            [ -f "$db.db" ] || { echo "::warning::缺 $db.db, 不传"; continue; }
            gzip -9 -c "$db.db" > "$db.db.gz"
          done
          ls -lh ./*.db.gz
          gh release create data --title "数据快照" \
            --notes "每日跑批产物,应用启动时自动拉取,请勿手动改动" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release upload data ./*.db.gz --clobber --repo "$GITHUB_REPOSITORY"
