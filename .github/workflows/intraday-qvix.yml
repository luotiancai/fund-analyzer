name: 盘中自算QVIX发布

on:
  # 只挂 workflow_dispatch,不用 GitHub 自己的 schedule——那个触发器高峰期
  # 会迟到几十分钟到数小时甚至整次丢弃(见 notify-qvix.yml 顶部的实测记录),
  # 盘中每几分钟一次的任务完全经不起这种延迟。
  # 由外部定时服务(cron-job.org)在交易时段调 GitHub API 触发,秒级启动:
  #   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/
  #        intraday-qvix.yml/dispatches
  #   body: {"ref":"main"}
  # 建议触发时段(北京时间, 周一至周五, 每 5~10 分钟一次):
  #   09:30~11:35 和 13:00~15:05
  # 收盘后不用一直触发:15:00 之后值就定格了, 跑一次拿到"今日收盘值"即可。
  workflow_dispatch: {}

permissions:
  contents: write   # gh release upload 需要

# 同一时刻只跑一个:外部 cron 偶尔重复触发时, 后来的直接取消, 不排队堆积。
concurrency:
  group: intraday-qvix
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip        # 缓存依赖:这个任务盘中要跑几十次, 每次重装 akshare 太浪费
      - name: 安装依赖(不装 streamlit)
        run: pip install --quiet requests pandas numpy akshare
      # 不下载数据库快照:算盘中值只需要网络(新浪行情 + SHIBOR), 用不到那 81MB。
      - name: 自算并发布
        run: python intraday_qvix.py
